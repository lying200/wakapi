<footer class="mt-20 py-6 border-t no-print" style="border-color: var(--glass-border);">
    <div class="flex flex-col md:flex-row justify-between items-center max-w-screen-xl mx-auto px-4 gap-4 text-sm text-muted">
        <div class="font-mono text-xs font-medium">
            {{ getVersion }} @ {{ getDbType }}
        </div>
        <div class="flex items-center gap-2">
            <span data-i18n="footer.made_with">Made with</span>
            <span class="iconify inline text-danger" data-icon="bi:heart-fill"></span>
            <span data-i18n="footer.by">by</span>
            <a href="https://muetsch.io" target="_blank" class="text-secondary hover:text-foreground transition-colors">Ferdi</a>
            <span class="text-muted/30">·</span>
            <span data-i18n="footer.open_source">Open source on</span>
            <a href="https://github.com/muety/wakapi" target="_blank" rel="noreferrer noopener">
                <span class="iconify inline text-secondary hover:text-foreground transition-colors" data-icon="codicon:github-inverted"></span>
            </a>
            {{ if eq getPublicUrl "https://wakapi.dev" }}
            <span class="text-muted/30">·</span>
            <span data-i18n="footer.hosted_in">Hosted securely in</span>
            <span class="iconify inline" data-icon="twemoji:flag-germany"></span>
            {{ end }}
        </div>
        <div>
            <a href="imprint" class="text-muted hover:text-secondary transition-colors" data-i18n="footer.imprint">Imprint, Cookies & Data Privacy</a>
        </div>
    </div>
</footer>
