<div class="relative z-20 w-full px-4 mt-1 sm:mt-2">
  <div class="flex justify-end flex-wrap gap-2">
    {{ if .LeaderboardEnabled }}
    <a href="leaderboard" class="btn-default inline-flex items-center gap-2 whitespace-nowrap">
      <span class="iconify inline" data-icon="fluent:data-bar-horizontal-24-filled"></span>
      <span data-i18n="nav.leaderboard">Leaderboard</span>
    </a>
    {{ end }}
    <a href="login" class="btn-primary inline-flex items-center gap-2 whitespace-nowrap">
      <span class="iconify inline" data-icon="fluent:key-24-filled"></span>
      <span data-i18n="login.login">Log in</span>
    </a>
  </div>
</div>
